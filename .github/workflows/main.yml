name: Process Video - Depth Map

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      video_url:
        description: 'URL direct către videoclip (opțional)'
        required: false
        type: string

jobs:
  process-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install opencv-python pillow numpy onnxruntime tqdm
      
      - name: Download Depth Anything V2 ONNX model
        run: |
          echo "📥 Descărcare model Depth Anything V2 (ONNX)..."
          wget -q --show-progress https://huggingface.co/depth-anything/Depth-Anything-V2-Small/resolve/main/depth_anything_v2_small.onnx
          echo "✅ Model descărcat!"
      
      - name: Download video from URL (if provided)
        if: github.event.inputs.video_url != ''
        run: |
          echo "📥 Descărcare videoclip de la: ${{ github.event.inputs.video_url }}"
          wget -q --show-progress -O input_video.mp4 "${{ github.event.inputs.video_url }}"
      
      - name: Use uploaded video
        if: github.event.inputs.video_url == ''
        run: |
          echo "⚠️ Folosește videoclipul din repository (input_video.mp4)"
          echo "Pentru a procesa alt videoclip, încarcă-l în repository sau folosește URL"
      
      - name: Process video
        run: |
          python process_video.py input_video.mp4 depth_output.mp4
      
      - name: Upload depth video
        uses: actions/upload-artifact@v4
        with:
          name: depth-video
          path: depth_output.mp4
          retention-days: 7
      
      - name: Upload depth frames (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: depth-frames
          path: frames_output/
          retention-days: 7
